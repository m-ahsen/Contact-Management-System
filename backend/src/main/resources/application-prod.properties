# Require TLS with CA + hostname verification. Import the MySQL server CA into the
# JVM truststore, or append truststore JDBC params via MYSQL_TRUSTSTORE_PARAMS, e.g.
# &trustCertificateKeyStoreUrl=file:/path/truststore.jks&trustCertificateKeyStorePassword=secret
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:contact_management}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC${MYSQL_TRUSTSTORE_PARAMS:}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.ahsen.contactmanagement=INFO

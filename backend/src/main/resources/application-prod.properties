# Require TLS with CA + hostname verification. Import the MySQL server CA into the
# JVM truststore, or append truststore JDBC params via MYSQL_TRUSTSTORE_PARAMS, e.g.
# &trustCertificateKeyStoreUrl=file:/path/truststore.jks&trustCertificateKeyStorePassword=secret
# All DB_* variables are required — no local/root fallbacks in production.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC${MYSQL_TRUSTSTORE_PARAMS:}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.ahsen.contactmanagement=INFO

# JWT_SECRET is required in production — no local default.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.application.name=contactmanagement

# Do not default a profile here. Activate explicitly so missing production
# configuration cannot silently load the local MySQL (dev) settings:
#   Dev:  SPRING_PROFILES_ACTIVE=dev  (or -Dspring-boot.run.profiles=dev)
#   Prod: SPRING_PROFILES_ACTIVE=prod
#   Test: @ActiveProfiles("test") / SPRING_PROFILES_ACTIVE=test

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.com.ahsen.contactmanagement=INFO

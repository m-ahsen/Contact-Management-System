spring.application.name=contactmanagement

# Local/IDE default is "dev". Production MUST set SPRING_PROFILES_ACTIVE=prod
# (prod credentials have no local fallbacks and will fail closed if missing).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.com.ahsen.contactmanagement=INFO

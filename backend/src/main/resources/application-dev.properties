# Local MySQL — use a non-root account (override with DB_USERNAME / DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/contact_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:cms_dev}
spring.datasource.password=${DB_PASSWORD:cms_dev_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Local-only JWT default. Override with JWT_SECRET. Production has no default.
app.jwt.secret=${JWT_SECRET:local-dev-only-change-me-must-be-32-bytes-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
